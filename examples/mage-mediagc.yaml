# mage-mediagc configuration.
#
# Every value here is optional. Resolution order, later sources winning:
#
#   1. built-in defaults
#   2. this file
#   3. <magento root>/app/etc/env.php  (fills gaps only, never overwrites)
#   4. MAGEGC_* environment variables
#   5. command-line flags
#
# The practical consequence: running `mage-mediagc scan` from a Magento root
# needs no configuration at all, because the database credentials and the
# media path are derived from the installation.

magento:
  # Installation root, the directory holding app/etc/env.php.
  # Left empty, the tool walks up from the working directory to find it.
  root: /var/www/magento

  # Originals live here. Derived from root when empty:
  #   <root>/pub/media/catalog/product
  mediaPath: ""

database:
  # All of these are read from env.php when left empty, so in the common case
  # you only need this section to point at a replica or a socket.
  host: ""
  port: 0
  name: ""
  user: ""
  password: ""
  # Overrides host/port when set.
  socket: ""
  charset: utf8mb4

scan:
  # Parallel walkers. 0 means one per CPU, capped at 16.
  workers: 0

  # Parse product descriptions and CMS content for embedded images.
  # Strongly recommended: without it, an image that only appears inside page
  # copy looks orphaned and would be quarantined. This is the single most
  # common way a gallery-only cleaner destroys a live shop image.
  includeContentRefs: true

  # Index pub/media/catalog/product/cache as ordinary files instead of
  # measuring it separately. Almost never what you want.
  includeCache: false

  # Skip entries whose path relative to mediaPath, or whose base name, matches
  # one of these shell patterns. A matching directory is skipped whole.
  # Useful for staging folders an importer left behind.
  #   excludeGlobs:
  #     - staging
  #     - "*.tmp"
  #     - "catalog/product/tmp"

cleanup:
  # Holding directory for quarantined files. Must be on the same filesystem as
  # the media tree, otherwise a move becomes a copy and temporarily doubles
  # disk usage. Derived from root when empty:
  #   <root>/var/mage-mediagc/quarantine
  quarantineDir: ""

  # Rows per DELETE statement for `db-clean`. Small batches keep row locks and
  # replication lag predictable on a live shop.
  batchSize: 1000

  # Parallel file moves. Moves are inode renames, so this scales well.
  parallel: 0

  # Permit a quarantine run whose holding directory sits on another
  # filesystem. Off by default because the copy can fill the disk.
  allowCrossDevice: false

  # `quarantine` aborts when the orphan ratio exceeds this value, unless
  # --force is given. A ratio above it nearly always means reference
  # collection failed rather than that the shop really is that full of
  # garbage, so the guard is worth keeping below 1. Range: (0, 1].
  maxDeleteFraction: 0.98

warm:
  # Storefront URL that `cache warm` resolves the derived image URLs against.
  # Left empty it is read from core_config_data (web/secure/base_url, then
  # web/unsecure/base_url), which requires database access. Setting it here or
  # passing --base-url is what lets a warm run work on a host with no database.
  #
  # Point it at the origin, not at a CDN: an edge that already holds the images
  # answers without the origin generating anything, and the cache stays empty
  # while every request reports success.
  baseUrl: ""

  # Size set to route the requests through, as a 32-character hex hash. Leave
  # empty: it is read from media/catalog/product/cache/, or recovered with one
  # request when the tree is empty. Computing it is not possible outside
  # Magento's own PHP code, and it does not need to be.
  #
  # Any set the theme still asks for will do — Magento regenerates every size
  # set on a single request, whatever hash was asked for — but a set it has
  # stopped asking for leaves the requested path absent, so a stale value is
  # corrected at runtime and reported.
  cacheHash: ""

  # Snapshot of the size sets, written by `cache clean --save-hashes` before the
  # cache is emptied. Saves the one request a cold start would spend recovering
  # a live set. Optional.
  hashFile: ""

  # Send the traffic to 127.0.0.1 instead of the address the storefront's domain
  # resolves to, keeping the Host header and the TLS server name, so the web
  # server still routes it to the right site. Set this when the tool runs on the
  # shop's own server: no external bandwidth, no DNS dependency, and — unlike an
  # /etc/hosts entry — no risk of silently reaching the wrong vhost on a host
  # that serves several shops.
  loopback: false

  # Replace the address dialed for one host and port, as "host:port:address".
  # Only needed where loopback is not enough. Repeatable.
  resolve: []

  # Accept any TLS certificate. Needed for a shop whose https certificate is
  # self-signed for an internal name, which carries no subject alternative name
  # and is therefore rejected outright by Go. Reported in the run's output,
  # because the run can then no longer tell the shop from anything else
  # answering on that address.
  insecureSkipVerify: false

  # Requests in flight. Deliberately lower than scan.workers: every request
  # makes the shop resize an image on the same PHP workers that serve visitors.
  # Raise it once you have measured the shop's tolerance with --max-requests.
  concurrency: 4

  # Timeout for one request.
  timeout: 30s

  # get downloads the variant; head asks for headers only. Prefer get: a proxy
  # or CDN may answer a head from the edge without generating anything.
  method: get

  # User-Agent header. Empty means a built-in default that names and versions
  # the tool, so this traffic is identifiable in the shop's access log.
  userAgent: ""

  # Stop after this many requests in one run. 0 means no limit. Useful to warm
  # a large catalog in slices: variants that already exist are skipped without
  # a request, so a later run continues where this one stopped.
  maxRequests: 0

  # Cap on request starts per second across all workers. 0 means no limit. The
  # polite setting for a shop that is live and busy.
  rate: 0

  # Fail the run when the share of non-2xx responses exceeds this. Range (0, 1].
  maxErrorFraction: 0.05

output:
  # table | json | markdown
  format: table

  # 0 = summary, 1 = per-source detail, 2 = include the file lists
  verbose: 0

  # Suppress progress output (reports still go to stdout).
  quiet: false
